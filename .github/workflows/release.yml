name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Dépendances
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Tests
        run: python -m unittest -v
      - name: Compilation
        run: python -m PyInstaller --noconfirm --clean forge411.spec
      - name: Notes de version (section du CHANGELOG)
        if: startsWith(github.ref, 'refs/tags/')
        shell: python
        run: |
          import re, os
          ver = os.environ["GITHUB_REF_NAME"].lstrip("v")
          text = open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(r"^## \[" + re.escape(ver) + r"\][^\n]*\n(.*?)(?=^## \[|\Z)", text, re.S | re.M)
          open("release-notes.md", "w", encoding="utf-8").write(m.group(1).strip() if m else "")
      - name: Publication de la release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Forge411.exe
          body_path: release-notes.md
