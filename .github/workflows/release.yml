name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Dépendances
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Tests
        run: python -m unittest -v
      - name: Compilation
        run: python -m PyInstaller --noconfirm --clean forge411.spec
      - name: Publication de la release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Forge411.exe
          generate_release_notes: true
